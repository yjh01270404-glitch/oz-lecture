<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>할 일 목록</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 500px;
        margin: 50px auto;
        padding: 20px;
      }
      h1 {
        text-align: center;
      }
      #inputArea {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      #taskInput {
        flex: 1;
        padding: 8px;
        font-size: 16px;
      }
      button {
        padding: 8px 16px;
        font-size: 16px;
        cursor: pointer;
      }
      #taskList {
        list-style: none;
        padding: 0;
      }
      #taskList li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px;
        border-bottom: 1px solid #ddd;
      }
      .completed {
        text-decoration: line-through;
        color: #aaa;
      }
      .delete-button {
        background: #ff4d4d;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
      }
      #clearButton {
        display: block;
        width: 100%;
        margin-top: 16px;
        background: #333;
        color: white;
        border: none;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>할 일 목록</h1>
    <div id="inputArea">
      <input id="taskInput" type="text" placeholder="할 일을 입력하세요" />
      <button id="addButton">추가</button>
    </div>
    <ul id="taskList"></ul>
    <button id="clearButton">전체 삭제</button>
    <script src="dom_assignment.js"></script>
  </body>
</html>
